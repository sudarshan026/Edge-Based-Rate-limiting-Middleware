# =============================================================================
# CDN / Edge Network Simulator — Nginx Reverse Proxy
# =============================================================================
#
# Simulates a CDN like Cloudflare / AWS CloudFront:
#   • Routes requests to the nearest Regional Edge POP based on X-Region header
#   • Falls back to round-robin across all POPs when no region is specified
#   • Adds observability headers (X-CDN-Routed-To, X-CDN-Region)
#
# Entry point: port 80 (mapped to host port 8080 by docker-compose)
# =============================================================================

# --------------------------------------------------------------------------
# Upstream groups — one per regional POP + a round-robin fallback
# --------------------------------------------------------------------------
upstream edge-mumbai {
    server edge-mumbai:8001;
}

upstream edge-delhi {
    server edge-delhi:8002;
}

upstream edge-bengaluru {
    server edge-bengaluru:8003;
}

# Round-robin fallback: distributes evenly when no region header is set
upstream edge-all {
    server edge-mumbai:8001;
    server edge-delhi:8002;
    server edge-bengaluru:8003;
}

# --------------------------------------------------------------------------
# Map X-Region header → upstream backend + display name
# --------------------------------------------------------------------------
map $http_x_region $target_backend {
    default         edge-all;
    "mumbai"        edge-mumbai;
    "delhi"         edge-delhi;
    "bengaluru"     edge-bengaluru;
    # Common aliases
    "mum"           edge-mumbai;
    "del"           edge-delhi;
    "blr"           edge-bengaluru;
    "bangalore"     edge-bengaluru;
}

map $http_x_region $routed_region {
    default         "auto-round-robin";
    "mumbai"        "mumbai";
    "delhi"         "delhi";
    "bengaluru"     "bengaluru";
    "mum"           "mumbai";
    "del"           "delhi";
    "blr"           "bengaluru";
    "bangalore"     "bengaluru";
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Health check for the CDN itself
    # ------------------------------------------------------------------
    location = /cdn-health {
        default_type application/json;
        return 200 '{"status":"ok","service":"cdn-edge-network","routing":"x-region-header or round-robin","pops":["mumbai:8001","delhi:8002","bengaluru:8003"]}';
    }

    # ------------------------------------------------------------------
    # All other requests → route to the appropriate Edge POP
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://$target_backend;
        proxy_http_version 1.1;

        # Pass through all original headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Preserve all client headers (x-api-key, x-region, etc.)
        proxy_pass_request_headers on;

        # CDN observability headers added to the response
        add_header X-CDN-Routed-To  $routed_region  always;
        add_header X-CDN-Node       "cdn-edge-network" always;

        # Timeouts
        proxy_connect_timeout  5s;
        proxy_read_timeout     15s;
        proxy_send_timeout     10s;
    }
}
