# =============================================================================
# Edge-Based Distributed Rate Limiting Middleware — Docker Compose
# =============================================================================
#
# Services
# --------
#   redis           Central Redis 7 — global quota store
#   origin          Origin Server (port 8000, internal only)
#   shield          Origin Shield with batch-sync daemon (port 9000, internal)
#   edge-mumbai     Regional Edge POP — Mumbai    (host port 8001)
#   edge-delhi      Regional Edge POP — Delhi     (host port 8002)
#   edge-bengaluru  Regional Edge POP — Bengaluru (host port 8003)
#
# Flow:  loadtest → edge-* (8001-8003) → shield (9000) → origin (8000) → redis (6379)
# =============================================================================

# ---------------------------------------------------------------------------
# Shared build definition (all Python services use the same image)
# ---------------------------------------------------------------------------
x-python-build: &python-build
  context: .
  dockerfile: Dockerfile

# Force amd64 on all services (prevents arm64 exec-format errors on x86_64 hosts)
x-platform: &platform
  platform: linux/amd64

# Shared health-check defaults
x-healthcheck-defaults: &hc-defaults
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:

  # --------------------------------------------------------------------------
  # Central Redis — no custom code, just the data store
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *platform
    container_name: rl-redis
    command: redis-server --save "" --appendonly no --loglevel notice
    ports:
      - "6379:6379"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - rl-net

  # --------------------------------------------------------------------------
  # Origin Server
  # --------------------------------------------------------------------------
  origin:
    build:
      <<: *python-build
    <<: *platform
    container_name: rl-origin
    volumes:
      - ./origin/main.py:/app/main.py:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    networks:
      - rl-net
    depends_on:
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Origin Shield  (rate limiting + batch sync daemon)
  # --------------------------------------------------------------------------
  shield:
    build:
      <<: *python-build
    <<: *platform
    container_name: rl-shield
    volumes:
      - ./shield/main.py:/app/main.py:ro
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --log-level info
    environment:
      - PYTHONUNBUFFERED=1
      - ORIGIN_URL=http://origin:8000
      - REDIS_URL=redis://redis:6379
      - BUCKET_CAPACITY=20
      - REFILL_PER_SEC=10
      - SYNC_INTERVAL=1.0
    expose:
      - "9000"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
    networks:
      - rl-net
    depends_on:
      redis:
        condition: service_healthy
      origin:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Regional Edge POPs  (Mumbai / Delhi / Bengaluru)
  # All three run identical code; POP_NAME distinguishes them.
  # --------------------------------------------------------------------------
  edge-mumbai:
    build:
      <<: *python-build
    <<: *platform
    container_name: rl-edge-mumbai
    volumes:
      - ./edge/main.py:/app/main.py:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --log-level info
    environment:
      - PYTHONUNBUFFERED=1
      - POP_NAME=mumbai
      - SHIELD_URL=http://shield:9000
    ports:
      - "8001:8001"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
    networks:
      - rl-net
    depends_on:
      shield:
        condition: service_healthy

  edge-delhi:
    build:
      <<: *python-build
    <<: *platform
    container_name: rl-edge-delhi
    volumes:
      - ./edge/main.py:/app/main.py:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --log-level info
    environment:
      - PYTHONUNBUFFERED=1
      - POP_NAME=delhi
      - SHIELD_URL=http://shield:9000
    ports:
      - "8002:8002"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
    networks:
      - rl-net
    depends_on:
      shield:
        condition: service_healthy

  edge-bengaluru:
    build:
      <<: *python-build
    <<: *platform
    container_name: rl-edge-bengaluru
    volumes:
      - ./edge/main.py:/app/main.py:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --log-level info
    environment:
      - PYTHONUNBUFFERED=1
      - POP_NAME=bengaluru
      - SHIELD_URL=http://shield:9000
    ports:
      - "8003:8003"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
    networks:
      - rl-net
    depends_on:
      shield:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Shared overlay network
# ---------------------------------------------------------------------------
networks:
  rl-net:
    driver: bridge
